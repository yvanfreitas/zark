name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Build first so the UI exists: the end-to-end PR test renders real PNGs.
      - run: pnpm build
      - run: pnpm --filter zark-vscode smoke
      - name: Chromium do Playwright (com dependências do sistema)
        run: pnpm --filter @zark/server exec playwright-core install --with-deps chromium
      - run: pnpm test
      - name: Exemplo do apêndice continua válido e canônico
        run: |
          node packages/cli/dist/main.js validate --dir examples/ecommerce/architecture
          node packages/cli/dist/main.js fmt --check --dir examples/ecommerce/architecture
          node packages/cli/dist/main.js render --check --dir examples/ecommerce/architecture
      - name: Experimento PNG entre máquinas (Windows vs Linux)
        run: |
          rm -rf /tmp/x && cp -r examples/ecommerce/architecture /tmp/x && rm -rf /tmp/x/rendered
          node packages/cli/dist/main.js render --dir /tmp/x
          for f in contexto vtex; do
            if cmp -s "examples/ecommerce/architecture/rendered/$f.png" "/tmp/x/rendered/$f.png"; then echo "CROSS $f: bytes IDENTICOS"; else echo "CROSS $f: bytes DIFERENTES"; ls -l "examples/ecommerce/architecture/rendered/$f.png" "/tmp/x/rendered/$f.png"; fi
          done
          node -e "const f=require('fs');for(const n of ['contexto','vtex']){const a=f.readFileSync('examples/ecommerce/architecture/rendered/'+n+'.png'),b=f.readFileSync('/tmp/x/rendered/'+n+'.png');const w=x=>x.readUInt32BE(16)+'x'+x.readUInt32BE(20);console.log('CROSS',n,'dims win',w(a),'linux',w(b))}"
