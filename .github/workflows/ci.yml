name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Exemplo do apêndice continua válido e canônico
        run: |
          node packages/cli/dist/main.js validate --dir examples/ecommerce/architecture
          node packages/cli/dist/main.js fmt --check --dir examples/ecommerce/architecture
