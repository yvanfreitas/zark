# yaml-language-server: $schema=https://unpkg.com/zark/schema/drawing.json

id: vtex
name: VTEX
description: Sellers, CD principal e pagamento dentro da VTEX.
scope: vtex

nodes:
  cd-principal: { x: 400, y: 96 }
  gateway: { x: 0, y: -224 }
  seller-jardins: { x: 0, y: 192 }
  seller-phg: { x: 0, y: 0 }
  sintese: { x: -400, y: 96 }
  stone: { x: 400, y: -224 }
  trinio: { x: -400, y: -224 }

edges:
  gateway.autoriza: { shape: straight }
  gateway.pedido: { shape: step }
  seller-jardins.estoque: { shape: step }
  seller-jardins.pedidos: { shape: step }
  seller-phg.estoque: { shape: step }
  seller-phg.pedidos: { shape: step }
  sintese.inventario-jardins: { shape: step, labelAt: 0.3 }
  sintese.inventario-phg: { shape: step, labelAt: 0.3 }
  trinio.pagamento: { shape: straight }

groups:
  - id: sellers-whitelabel
    label: Sellers Whitelabel
    members: [ seller-phg, seller-jardins ]
    style: dashed
